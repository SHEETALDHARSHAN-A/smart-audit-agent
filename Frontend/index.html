<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Audit Agent - Document Review</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40">
                        <circle cx="20" cy="20" r="18" fill="#2563eb" opacity="0.1" />
                        <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="#2563eb" />
                        <circle cx="20" cy="20" r="4" fill="#fff" />
                    </svg>
                    <h1>Smart Audit Agent</h1>
                </div>
                <div class="header-stats">
                    <div class="stat">
                        <span class="stat-value" id="total-docs">0</span>
                        <span class="stat-label">Documents</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="pending-docs">0</span>
                        <span class="stat-label">Pending Review</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section id="upload-section" class="section">
                <div class="upload-card">
                    <div class="upload-zone" id="upload-zone">
                        <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <h3>Drag & Drop Document</h3>
                        <p>or click to browse</p>
                        <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg" hidden>
                        <p class="file-types">Supports PDF, PNG, JPG</p>
                    </div>
                    <div class="upload-progress" id="upload-progress" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <p id="progress-text">Processing...</p>
                    </div>
                </div>
            </section>

            <!-- Review Section -->
            <section id="review-section" class="section" style="display: none;">
                <div class="review-container">
                    <!-- Document Preview -->
                    <div class="preview-panel">
                        <div class="panel-header">
                            <h3>Document Preview</h3>
                            <div class="confidence-badge" id="confidence-badge"></div>
                        </div>
                        <div class="preview-content">
                            <canvas id="pdf-canvas"></canvas>
                            <img id="image-preview" style="display: none; width: 100%; height: auto;">
                        </div>
                    </div>

                    <!-- Extraction Form -->
                    <div class="form-panel">
                        <div class="panel-header">
                            <h3>Extracted Data</h3>
                            <button class="btn btn-secondary" onclick="backToUpload()">← Back</button>
                        </div>
                        <form id="review-form" class="review-form">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="date">Invoice Date</label>
                                    <input type="text" id="date" placeholder="DD/MM/YYYY">
                                </div>
                                <div class="form-group">
                                    <label for="invoice_no">Invoice Number</label>
                                    <input type="text" id="invoice_no">
                                </div>
                                <div class="form-group">
                                    <label for="vendor_name">Vendor Name</label>
                                    <input type="text" id="vendor_name">
                                </div>
                                <div class="form-group">
                                    <label for="gstin">GSTIN</label>
                                    <input type="text" id="gstin" placeholder="15 characters">
                                </div>
                                <div class="form-group">
                                    <label for="total">Total Amount</label>
                                    <input type="number" id="total" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label for="subtotal">Subtotal</label>
                                    <input type="number" id="subtotal" step="0.01" placeholder="Before tax">
                                </div>
                            </div>

                            <!-- Tax Breakdown -->
                            <div class="form-section">
                                <h4>Tax Details</h4>
                                <div class="form-grid tax-grid">
                                    <div class="form-group">
                                        <label for="sgst">SGST</label>
                                        <input type="number" id="sgst" step="0.01" placeholder="0.00">
                                    </div>
                                    <div class="form-group">
                                        <label for="cgst">CGST</label>
                                        <input type="number" id="cgst" step="0.01" placeholder="0.00">
                                    </div>
                                    <div class="form-group">
                                        <label for="igst">IGST</label>
                                        <input type="number" id="igst" step="0.01" placeholder="0.00">
                                    </div>
                                    <div class="form-group">
                                        <label for="total_tax">Total Tax</label>
                                        <input type="number" id="total_tax" step="0.01" placeholder="0.00">
                                    </div>
                                </div>
                            </div>

                            <!-- Summary -->
                            <div class="form-group full-width">
                                <label for="summary">Bill Summary</label>
                                <textarea id="summary" rows="2"
                                    placeholder="Brief description of the bill..."></textarea>
                            </div>

                            <!-- Line Items -->
                            <div class="line-items" id="line-items-container">
                                <h4>Line Items</h4>
                                <div id="line-items"></div>
                            </div>

                            <!-- Actions -->
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary"
                                    onclick="rejectDocument()">Reject</button>
                                <button type="submit" class="btn btn-primary">Approve & Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Documents List -->
            <section id="documents-section" class="section">
                <div class="documents-list">
                    <h3>Recent Documents</h3>
                    <div id="documents-grid" class="documents-grid"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
